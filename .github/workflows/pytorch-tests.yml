name: PyTorch tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test tools
        run: pip install -e . pytest
      - name: Count configured 200M model parameters
        run: python scripts/count_parameters.py --config configs/anima200m.yaml
      - name: Run test suite
        run: pytest -q
