[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anima36"
version = "0.1.0"
description = "Experimental Anima-36 diffusion transformer scaffold"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
