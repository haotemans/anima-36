model:
  name: anima36
  depth: 36
  hidden_size: 2048
  num_heads: 16
  head_dim: 128
  latent_channels: null
  patch_size: 2
  block_type: "hybrid_linear_attention_lsnet"

attention:
  type: "positive_feature_linear_attention"
  qk_rms_norm: true
  position: "2d_sincos_input"
  kv_stride: 2
  fusion: "projected_gated_sum"
  local_branch_gate_init: 0.1
  all_blocks_hybrid: true

lsconv:
  implementation: "portable_pytorch_lkp_ska_reference"
  large_kernel_size: 7
  small_kernel_size: 3
  groups: 8
  branch_output: "lsconv_output_minus_input"

conditioning:
  timestep_embedding: "sinusoidal_then_mlp_once_per_model"
  per_block_adaln: ["hybrid_attention", "text_cross_attention", "swiglu_ffn"]
  modulation_parameters_per_branch: ["shift", "scale", "residual_gate"]

ffn:
  type: swiglu
  hidden_size: 8192
  fused_gate_up_projection: true

normalization:
  type: rmsnorm
  pre_norm: true

attnres:
  enabled: true
  grouping: 4
  equation: "softmax learned weights over recent normalized states, projected and gated"

text:
  model_id: "Qwen/Qwen3.5-4B"
  remove_legacy_llm_adapter: true
  selected_hidden_layers: null
  staged_injection:
    blocks_1_12: ["middle", "deep"]
    blocks_13_24: ["shallow", "middle", "deep"]
    blocks_25_36: ["shallow", "deep"]
  fusion: "dedicated_cross_attention"
  projection_dim: 2048

vae:
  model_id: "Qwen-Image-2.1"
  latent_channels: null
  spatial_scale: null
  scaling_factor: null
  shift_factor: null

training:
  gradient_checkpointing: true
  mixed_precision: "bf16"
  torch_compile: "optional"
  fused_adamw: "cuda_when_supported"
  allow_tf32: true
